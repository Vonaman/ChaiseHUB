services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./api_des_chaises
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DB_HOST: database       
      DB_PORT: 5432           
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - database

  frontend:
    build:
      context: ./chaise-hub
    restart: unless-stopped
    ports:
      - "3000:3000"            
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
    depends_on:
      - api

networks:
  chaisehub:

volumes:
  pgdata: